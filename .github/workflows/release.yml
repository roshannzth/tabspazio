name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all browser extensions
        run: npm run build:all

      - name: Package Chrome extension
        run: |
          cd dist/chrome
          zip -r ../../tabspazio-chrome.zip .

      - name: Package Firefox extension
        run: |
          cd dist/firefox
          zip -r ../../tabspazio-firefox.zip .

      - name: Package Chromium extension
        run: |
          cd dist/chromium
          zip -r ../../tabspazio-chromium.zip .

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          echo "Target Release Version: $VERSION"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Updating release assets..."
            gh release upload "$VERSION" tabspazio-chrome.zip tabspazio-firefox.zip tabspazio-chromium.zip --clobber
          else
            echo "Creating new release $VERSION..."
            gh release create "$VERSION" \
              tabspazio-chrome.zip \
              tabspazio-firefox.zip \
              tabspazio-chromium.zip \
              --title "$VERSION" \
              --generate-notes \
              --latest
          fi
          echo "Release successfully published: $(gh release view "$VERSION" --json url -q .url)"