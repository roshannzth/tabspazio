name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all browser extensions
        run: npm run build:all

      - name: Package Chrome extension
        run: |
          cd dist/chrome
          zip -r ../../tabspazio-chrome.zip .

      - name: Package Firefox extension
        run: |
          cd dist/firefox
          zip -r ../../tabspazio-firefox.zip .

      - name: Package Chromium extension
        run: |
          cd dist/chromium
          zip -r ../../tabspazio-chromium.zip .

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            tabspazio-chrome.zip
            tabspazio-firefox.zip
            tabspazio-chromium.zip